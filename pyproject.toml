[project]
name = "judge-server"
version = "0.1.0"
description = "OpenObserve reference Remote Judge Server (eval-judges)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "OpenObserve" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "litellm>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "respx>=0.21",
]

[project.scripts]
judge-server = "judge_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
